name: Update patch sources

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-patch-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: bundles
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.25,<1'
      - name: Discover and check patch repositories
        id: sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.update_patch_sources
      - name: Commit source changes
        env:
          PRUNED: ${{ steps.sources.outputs.pruned }}
        run: |
          if git diff --quiet -- config/sources.json; then
            exit 0
          fi
          message='chore: update patch sources'
          if [ "$PRUNED" = true ]; then
            message='chore: update patch sources (pruned dead repos)'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config/sources.json
          git commit -m "$message"
          git push origin HEAD:refs/heads/bundles
