name: Update patch sources

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview discovery, pruning, and approved imports without pushing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-patch-sources
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.APPROVED_IMPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: bundles
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx>=0.25,<1'
      - name: Discover and prune patch repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: python -m scripts.update_patch_sources
      - name: Import approved public sources
        id: import_sources
        env:
          APPROVED_SOURCES_URL: ${{ vars.APPROVED_SOURCES_URL }}
          IMPORT_ACCESS_CLIENT_ID: ${{ secrets.IMPORT_ACCESS_CLIENT_ID }}
          IMPORT_ACCESS_CLIENT_SECRET: ${{ secrets.IMPORT_ACCESS_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        run: python -m scripts.import_approved_sources
      - name: Preview combined source changes
        if: inputs.dry_run == true
        # Both scripts update the runner checkout so the diff includes their combined effects.
        run: |
          if git diff --quiet -- config/sources.json; then
            echo "No changes to config/sources.json."
          else
            git --no-pager diff -- config/sources.json
          fi
      - name: Push the inventory to start the catalog refresh
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          if git diff --quiet -- config/sources.json; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set the registry's GIT_TOKEN secret to a GitHub token with write access to bundles."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config/sources.json
          git commit -m 'chore: update patch sources'
          # The same credential used by catalog publication also delivers the push event.
          gh auth setup-git --hostname github.com --force
          git push origin HEAD:refs/heads/bundles
      - name: Report incomplete verification
        if: steps.import_sources.outputs.verification_deferred == 'true'
        run: |
          echo "::error::The forge API did not verify one or more approvals. Check the import log for details."
          exit 1
